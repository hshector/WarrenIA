[project]
name = "warrenia-engine"
version = "0.1.0"
description = "WarrenIA market data + momentum engine (EOD, explainable, reproducible)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3.1",
  "numpy>=1.26",
  "pyarrow>=16",
  "pyyaml>=6",
  "requests>=2.32",
  "exchange_calendars>=4.5",
  "pywebpush>=2.0,<3",       # signal-change notifications (Web Push, VAPID)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["warrenia_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
