# Daily market data job: incremental ingest (Massive EOD) + SEC fundamentals +
# scoring + publish to Supabase Storage, then EUR prices (EODHD) and ECB FX.
# Runs without the web being open. Also triggered by the web "Actualizar" button
# (workflow_dispatch) and manually from the Actions tab.
name: market-data

on:
  schedule:
    # Tue-Sat 05:15 UTC: after midnight New York time, so free plans already serve the
    # previous session in full. 11:05 UTC retry (exits in seconds if already published).
    - cron: "15 5 * * 2-6"
    - cron: "5 11 * * 2-6"
  workflow_dispatch:
    inputs:
      mode:
        description: "update = ingest + compute; compute = recompute only"
        required: false
        default: update
        type: choice
        options: [update, compute]

concurrency:
  group: market-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_BUCKET: ${{ vars.SUPABASE_BUCKET || 'market' }}
      WARRENIA_CONFIG_DIR: ${{ github.workspace }}/config
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
      MASSIVE_MIN_INTERVAL: ${{ vars.MASSIVE_MIN_INTERVAL || '12.5' }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
      INGEST_MAX_MINUTES: "180"  # leaves ~2.5h for corporate actions, SEC, compute and publish
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        run: pip install -e ./engine
      - name: Check secrets and permissions
        run: python -m warrenia_engine doctor
      - name: Ingest + compute + publish
        id: ingest
        run: python -m warrenia_engine ${{ github.event.inputs.mode || 'update' }}
      - name: EUR prices + ECB FX (portfolio)
        if: success() || failure() && steps.ingest.outcome == 'failure'
        run: python -m warrenia_engine eu-prices
      - name: Company logos (Logo.dev, fetched once and cached)
        # Cosmetic: never fails the job, and runs even if the ingest failed (the
        # previous published radar is enough to know which tickers to look up).
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
        run: python -m warrenia_engine logos
